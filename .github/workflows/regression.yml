name: Regression checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/handoff-production-v6

permissions:
  contents: read

jobs:
  quality:
    name: Type, build, and unit regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test

  accessibility:
    name: WCAG automated regression
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:a11y
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accessibility-results
          path: artifacts/a11y-regression/results.json
          if-no-files-found: warn
